    const recent = S.lens.slice(-12), mx=Math.max(...recent), mn=Math.min(...recent);
    html += `<div class="bars" aria-label="Recent cycle lengths">${recent.map(l=>`<div style="height:${mx===mn?70:Math.round(35+65*(l-mn)/(mx-mn))}%" title="${l} days"></div>`).join("")}</div>
      <div class="small muted">Last ${recent.length} completed cycle${recent.length===1?"":"s"}: <span class="num">${recent.join(", ")}</span> days</div>`;
  } else if(!S.perN) html += `<p class="small muted" style="margin:0">${settings.usualLen?`Usual length you entered: <b class="num">${settings.usualLen}</b> days. `:""}Recorded averages appear once a cycle is complete, which is when the next one starts.</p>`;
  html += `</div>`;
  html += estimateHTML(S, cur);
  if(S.n<3) html += pastHTML();
  html += `<div class="card"><span class="label">History</span><div class="cyclelist">`;
  let num = CYC.filter(c=>!c.unknownStart).length;
  for(let i=CYC.length-1;i>=0;i--){
    const c=CYC[i], ev=c.ev;
    const name = c.unknownStart ? "Before first marked period" : `Cycle ${num--}${c.current?" · current":""}`;
    const bits = [];
    if(ev.infertileFrom!==null) bits.push(`ovulation confirmed, peak day ${ev.peak+1}`);
    else if(ev.temp.state==="confirmed") bits.push(`temp rise day ${ev.temp.highs[0]+1}, mucus unconfirmed`);
    else if(!c.unknownStart) bits.push(c.current?"in progress":"no confirmed ovulation");
    if(c.perLen) bits.unshift(`${c.perLen}-day period`);
    html += `<button class="cyc" data-i="${i}"><span class="t">${name}</span><span class="len">${c.len}<span class="small muted"> d</span></span>
      <span class="m">${fmt(c.start)} – ${c.current?"today":fmt(c.end)}${bits.length?" · "+bits.join(", "):""}</span></button>`;
  }
  html += `</div></div>`;
  if(S.n>=3) html += pastHTML();
  v.innerHTML = html;
  bindPast();
  v.querySelectorAll(".cyc").forEach(b=>b.onclick=()=>{ chartIdx=+b.dataset.i; showTab("chart"); });
}
function pastHTML(){
  const starts = Object.keys(days).filter(k=>days[k].start).sort().reverse();
  return `<div class="card"><span class="label">Past periods & basics</span>
    <div class="small muted">Enter the first day of past periods you know. Each pair of start dates gives one cycle length. Single past days (temperature, mucus) go on the Log tab: tap the date or use ‹.</div>
    <div class="row"><input type="date" class="textin" id="pastDate" max="${TODAY}" style="flex:1;min-width:150px"><button class="primary" id="pastAdd" style="font-size:14px;min-height:44px">Add period start</button></div>
    ${starts.length?`<div class="chips" id="pastList">${starts.map(d=>`<button class="chip" data-d="${d}" title="Remove this period start">${fmtY(d)} <span aria-hidden="true">×</span></button>`).join("")}</div><div class="small muted">Tap a date to remove it.</div>`:""}
    <div class="sublabel" style="margin-top:6px">What’s usual for you</div>
    <div class="row"><input class="textin num" id="usualLen" inputmode="numeric" placeholder="28" value="${settings.usualLen??""}" style="width:76px;flex:none"><span class="muted small" style="flex:1;min-width:120px">days per cycle</span></div>
    <div class="row"><input class="textin num" id="usualPer" inputmode="numeric" placeholder="5" value="${settings.usualPeriod??""}" style="width:76px;flex:none"><span class="muted small" style="flex:1;min-width:120px">days of bleeding</span></div>
    <button class="ghost" id="usualSave" style="align-self:flex-start">Save</button>
    <div class="small muted">Used for predictions until enough of your own cycles and periods are logged.</div></div>`;
}
function bindPast(){
  const add=$("pastAdd"); if(!add) return;
  add.onclick=()=>{
    const d=$("pastDate").value;
    if(!DATE_RE.test(d) || d>TODAY){ toast("Pick a date first."); return; }
    if(days[d]&&days[d].start){ toast("That date is already a period start."); return; }
    patch(d,{start:true}).then(()=>toast("Period start added for "+fmtY(d)+".")).catch(()=>{});
  };
  const list=$("pastList");
  if(list) list.onclick=e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(!b.classList.contains("danger")){ b.classList.add("danger","armed"); b.firstChild.textContent="Remove "+fmt(b.dataset.d)+"? "; return; }
    patch(b.dataset.d,{start:false}).then(()=>toast("Period start removed.")).catch(()=>{});
  };
  $("usualSave").onclick=()=>{
    const ls=$("usualLen").value.trim(), ps=$("usualPer").value.trim(), n=Number(ls), p=Number(ps);
    if(ls && !(n>=15&&n<=60)){ toast("Cycle length should be between 15 and 60 days."); return; }
    if(ps && !(p>=1&&p<=12)){ toast("Period length should be between 1 and 12 days."); return; }
    saveSettings({usualLen: ls?n:null, usualPeriod: ps?p:null}).then(()=>toast("Saved."));
  };
}
function estimateHTML(S, cur){
  const parts=[];
  const idx = diffDays(cur.start, TODAY), ev=cur.ev;
  if(!cur.unknownStart){
    if(ev.infertileFrom===null && idx<ev.fertileStart){
      parts.push(`<div>Fertile window opens on <b>day ${ev.fertileStart+1}</b> (${fmtW(addDays(cur.start,ev.fertileStart))}) by the first-${ev.ruleLast}-day rule, or earlier the first day you notice any mucus or moistness.</div>`);
    } else if(ev.infertileFrom===null){
      parts.push(`<div>You’re in the fertile window now. It closes once temperature and mucus both confirm ovulation.</div>`);
      if(S.ovAvg!=null && S.n>=3) parts.push(`<div class="small muted">In past cycles the mucus peak came around day ${Math.round(S.ovAvg)}.</div>`);
    }
  }
  const P = predict(CYC, S);
  if(P.len && !cur.unknownStart){
    const nsLo = addDays(cur.start, Math.round(P.lo)), nsHi = addDays(cur.start, Math.round(P.hi));
    const pl = Math.round(P.per);
    if(P.late!==null) parts.push(`<div>Period was expected ${fmtW(P.expected)}${P.late?`, now <b>${P.late} day${P.late===1?"":"s"} late</b>`:", so it’s due <b>today</b>"}.</div>`);
    else parts.push(`<div>Next period around <b>${fmtW(P.future[0].start)}</b> <span class="muted">(range ${fmt(nsLo)} – ${fmt(nsHi)})</span>, lasting about ${pl} day${pl===1?"":"s"}.</div>`);
    if(P.lenSrc!=="recorded") parts.push(`<div class="small muted">${P.lenSrc==="usual"?`Based on the usual length you entered (${P.len} days).`:`Based on only ${S.n} recorded cycle${S.n===1?"":"s"}.`} Switches to your recorded average once 3 cycles are complete.</div>`);
    if(ev.infertileFrom!==null || idx>=ev.fertileStart){
      let openDay = ev.ruleLast+1;
      if(S.earliestMucus!=null) openDay = Math.min(openDay, S.earliestMucus+1);
      parts.push(`<div>By the day rule, the next fertile window opens around <b>${fmt(addDays(nsLo, openDay-1))}</b>, cycle day ${openDay} counted from the earliest expected period. Mucus or the day rule decide on the day.</div>`);
    }
  } else if(!cur.unknownStart) {
    parts.push(`<div class="small muted">Period and fertile-window estimates appear once you enter your usual cycle length below, or after your first complete cycle.</div>`);
  }
  if(!parts.length) return "";
  return `<div class="estimate"><span class="tag">Estimate</span>${parts.join("")}</div>`;
}

/* ---------- DATA ---------- */
function toJSON(){ return JSON.stringify({app:"Cyclette", version:1, exportedAt:new Date().toISOString(), settings, days:Object.keys(days).sort().map(k=>days[k])}, null, 1); }
const CSV_COLS=["date","temperature_c","disturbed","disturbed_reason","sensation","appearance","bleeding","cycle_start","notes"];
function csvCell(v){ v = v==null?"":String(v); return /[",\n;]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; }
function toCSV(){
  const rows=[CSV_COLS.join(",")];
  Object.keys(days).sort().forEach(k=>{ const e=days[k]; rows.push([k, e.temp!=null?e.temp.toFixed(2):"", e.dist?"yes":"", e.distReason, e.sens||"", e.app||"", e.bleed||"", e.start?"yes":"", e.note].map(csvCell).join(",")); });
  return rows.join("\n");
}
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=""; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  const head = (rows.shift()||[]).map(h=>h.trim().toLowerCase());
  const ix = n=>head.indexOf(n);
  if(ix("date")<0) throw new Error("The CSV needs a 'date' column.");
  const yes = s=>/^(yes|true|1|x)$/i.test(String(s||"").trim());
  return rows.filter(r=>r.length>1||r[0]).map(r=>{
    const g=n=>ix(n)>=0?(r[ix(n)]||"").trim():"";
    const t=g("temperature_c")||g("temperature")||g("temp");
    return {date:g("date"), temp: t?Number(t.replace(",",".")):null, dist:yes(g("disturbed")), distReason:g("disturbed_reason"), sens:g("sensation")||null, app:g("appearance")||null, bleed:g("bleeding")||null, start:yes(g("cycle_start")), note:g("notes")};
  });
}
function parseImport(text){
  const s=text.trim();
  if(s.startsWith("{")||s.startsWith("[")){
    const o=JSON.parse(s); const arr=Array.isArray(o)?o:(o.days||[]);
    if(!Array.isArray(o) && o.settings) pendingSettings=normSettings(o.settings);
    if(!Array.isArray(arr)) throw new Error("No days found in this file.");
    return arr;
  }
  return parseCSV(s);
}

let pendingImport=null, pendingSettings=null;
function renderData(){
  const v=$("v-data");
  const keep={}; ["ccEmail","ccPw","ccUrl","ccKey","ccNewPw"].forEach(id=>{ const el=$(id); if(el) keep[id]=el.value; });
  const focused=document.activeElement&&document.activeElement.id;
  v.innerHTML = `
  ${cloudCardHTML()}
  <div class="card"><span class="label">Back up to a file</span>
    <div class="small muted">${Cloud.user?"Optional extra copy.":"Keep the file in Files, iCloud or Google Drive."} Last backup: ${settings.lastBackup?fmtY(settings.lastBackup):"never"}</div>
    <div class="btnrow"><button class="primary" id="exJson" style="font-size:14px">Back up (JSON)</button><button class="ghost" id="exCsv">Export CSV</button></div>
    <button class="linkbtn" id="exShow" style="align-self:flex-start">Show backup as text instead</button>
    <div class="exportbox" id="exBox" hidden><div class="small muted" id="exMsg"></div><textarea id="exText" readonly></textarea><button class="ghost" id="exCopy">Copy to clipboard</button></div>
  </div>
  <div class="card"><span class="label">Restore</span>
    <div class="small muted">Import a JSON or CSV file exported from this app. CSV columns: <span class="num small">${CSV_COLS.join(", ")}</span>.</div>
    <input type="file" id="imFile" accept=".json,.csv,application/json,text/csv,text/plain">
    <div id="imBox" hidden class="view" style="gap:8px"><div class="small" id="imMsg"></div>
      <div class="btnrow"><button class="primary" id="imMerge" style="font-size:14px">Add to my data</button><button class="ghost danger" id="imReplace">Replace all my data</button></div></div>
  </div>
  <div class="card rules"><span class="label">How the evaluation works</span>
    <p><b>Temperature.</b> The first higher reading must be above each of the 6 readings before it. The coverline sits on the highest of those 6. You need 3 readings above it, the 3rd at least 0.20 °C above. If the 3rd falls short, a 4th reading above the line confirms (exception 1). One of the 3 may dip to or below the line and is skipped, but then the 3rd must be 0.20 above (exception 2). The two exceptions can’t be combined. Disturbed readings are left out.</p>
    <p><b>Mucus.</b> Each day is graded t, ø, f, S or S+ from the better of sensation and appearance. The peak is the last day of best quality, seen once quality drops.</p>
    <p><b>Fertile window.</b> Opens on day 6, or earlier the first day of any mucus or moistness. After 12 cycles with a confirmed rise, the earliest first higher reading minus 8 days replaces day 6 if it’s earlier. Closes on the evening of the later of the 3rd confirming temperature and the 3rd day after the peak.</p>
    <p class="muted small">The app follows the published Sensiplan rules but can’t check how you measured. If you rely on it for contraception, learn the method from a course or the Sensiplan handbook and double-check charts that look unusual.</p>
  </div>
  <div class="card"><span class="label">Danger zone</span><button class="ghost danger" id="wipe">Delete all data${Cloud.user?" (also in the cloud)":""}</button></div>`;
  bindCloud();
  Object.keys(keep).forEach(id=>{ const el=$(id); if(el) el.value=keep[id]; });
  if(focused && $(focused) && keep[focused]!==undefined){ try{ $(focused).focus({preventScroll:true}); }catch(_){} }
  $("exJson").onclick=()=>doExport("json"); $("exCsv").onclick=()=>doExport("csv"); $("exShow").onclick=()=>showExportText("json");
  $("imFile").onchange=onFile;
  $("wipe").onclick=e=>{
    const b=e.currentTarget;
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent=`Tap again to delete all ${Object.keys(days).length} days`; setTimeout(()=>{b.classList.remove("armed"); b.textContent="Delete all data";},4000); return; }
    b.disabled=true; b.textContent="Deleting…";
    putMany([], true).then(()=>saveSettings({usualLen:null, usualPeriod:null})).then(()=>{ toast("All data deleted."); renderData(); }).catch(()=>renderData());
  };
}
async function doExport(kind){
  const data = kind==="json"?toJSON():toCSV();
  const filename = `cyclette-${TODAY}.${kind}`;
  const type = kind==="json" ? "application/json" : "text/csv";
  const done = msg => { if(kind==="json") saveSettings({lastBackup:TODAY}); toast(msg); };
  try{
    const file = new File([data], filename, {type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:filename}); done("Backup ready. Save it somewhere safe."); return; }
      catch(e){ if(e && e.name==="AbortError"){ toast("Backup cancelled."); return; } }
    }
  }catch(e){}
  try{
    const url = URL.createObjectURL(new Blob([data],{type}));
    const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    done("Backup downloaded.");
  }catch(e){ showExportText(kind); }
}
function showExportText(kind){
  const data = kind==="json"?toJSON():toCSV();
  $("exBox").hidden=false; $("exText").value=data;
  $("exMsg").textContent = `Copy this text and save it as cyclette-${TODAY}.${kind}. You can import it again later.`;
  $("exCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(data); if(kind==="json") saveSettings({lastBackup:TODAY}); toast("Copied."); }catch(e){ $("exText").select(); toast("Selected. Use your phone’s Copy."); } };
}
function onFile(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const arr=parseImport(String(r.result));
      const valid=arr.filter(x=>x&&DATE_RE.test(x.date));
      if(!valid.length) throw new Error("No days with a valid date (YYYY-MM-DD) found.");
      pendingImport=valid;
      $("imBox").hidden=false;
      const sorted=valid.map(x=>x.date).sort();
      const overlap=valid.filter(x=>days[x.date]).length;
      $("imMsg").innerHTML=`Found <b>${valid.length}</b> days, ${fmtY(sorted[0])} to ${fmtY(sorted[sorted.length-1])}.${overlap?` ${overlap} of them already exist and would be overwritten.`:""}`;
      $("imMerge").onclick=()=>runImport(false); $("imReplace").onclick=()=>runImport(true);
    }catch(err){ $("imBox").hidden=false; $("imMsg").textContent="Couldn’t read that file: "+err.message; $("imMerge").hidden=true; $("imReplace").hidden=true; }
  };
  r.readAsText(f);
}
async function runImport(replace){
  if(!pendingImport) return;
  const b=replace?$("imReplace"):$("imMerge");
  if(replace && !b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Tap again to replace everything"; return; }
  $("imMerge").disabled=$("imReplace").disabled=true;
  try{
    const n=await putMany(pendingImport, replace, (d,t)=>{ $("imMsg").textContent=`Saving ${d} of ${t}…`; });
    if(pendingSettings){ const ps={}; if(pendingSettings.usualLen) ps.usualLen=pendingSettings.usualLen; if(pendingSettings.usualPeriod) ps.usualPeriod=pendingSettings.usualPeriod; if(Object.keys(ps).length) await saveSettings(ps); pendingSettings=null; }
    pendingImport=null; toast(`Imported. ${n} change${n===1?"":"s"} saved.`); renderData();
  }catch(err){ reportWriteError(err); $("imMerge").disabled=$("imReplace").disabled=false; }
}

/* ---------- tabs & render ---------- */
function showTab(t){
  tab=t;
  ["log","cal","chart","cycles","data"].forEach(k=>{ $("v-"+k).hidden = k!==t; });
  document.querySelectorAll(".tab").forEach(b=>{ if(b.dataset.tab===t) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  renderAll(true);
  window.scrollTo(0,0);
}
let dataRenderedOnce=false;
function renderAll(force){
  CYC = analyse(days, TODAY);
  renderLog();
  renderSyncPill();
  if(tab==="cal") renderCal();
  if(tab==="chart") renderChart();
  if(tab==="cycles") renderCycles();
  if(tab==="data" && (force || !dataRenderedOnce || !document.querySelector("#v-data #exBox:not([hidden]), #v-data #imBox:not([hidden])"))){ renderData(); dataRenderedOnce=true; }
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  const t=todayStr(); if(t!==TODAY){ TODAY=t; if(logFollowsToday) logDate=TODAY; renderAll(); }
  Cloud.sync();
});
window.addEventListener("online",()=>Cloud.sync());
window.addEventListener("offline",()=>{ if(Cloud.user){ Cloud.state="offline"; renderSyncPill(); } });

$("sync").onclick=()=>showTab("data");
buildStatic(); bindLog();
loadAll();
renderAll();
focusTemp();
Cloud.init();
if("serviceWorker" in navigator && location.protocol==="https:"){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
})();
</script>
