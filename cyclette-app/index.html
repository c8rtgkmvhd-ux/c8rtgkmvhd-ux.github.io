<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyclette</title>
<meta name="description" content="Cute cycle tracker for basal temperature, cervical mucus and periods.">
<meta name="theme-color" content="#FFF8E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cyclette">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/touch-icon-v2.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preload" href="fonts/nunito-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fredoka-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Fredoka";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/fredoka-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/fredoka-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/nunito-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2")}
/* Layout: one-column phone app, sticker-style cards on a polka-dot butter background, floating pill tab bar; chart scrolls sideways in its own box. Single light theme by choice. */
:root{
  --bg:#FFF8E8; --dot:#FFE9B8; --surface:#FFFFFF; --surface-2:#FFFBF2; --ink:#3B2F3A; --muted:#8F7F8B; --line:#F6DDE6; --grid:#FBEDF2; --grid-strong:#F1D3DE;
  --accent:#E9608F; --accent-ink:#FFFFFF; --accent-soft:#FFE3EE;
  --sun:#FFD861; --sun-soft:#FFF1C2; --sun-ink:#8A6200;
  --teal:#26A89B; --teal-soft:#D6F3EF;
  --period:#EE5A6C; --period-soft:#FFE0E4;
  --fertile:#FFEFB0; --fertile-ink:#946300; --ov:#F2A516;
  --ok:#1F9A8D; --ok-soft:#D6F3EF; --warn:#9A6A00; --warn-soft:#FFF0C4;
  --mucus:#2190B0; --cover:#E7A12E; --line-temp:#26A89B;
  --font-display:"Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body:"Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num:"Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --r:24px; --shadow:0 4px 0 var(--line);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-color:var(--bg);margin:0;min-height:100%;overscroll-behavior-y:none}
[hidden]{display:none!important}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease, background .15s}
button:active{transform:scale(.97)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:calc(14px + env(safe-area-inset-top, 0px)) calc(108px + env(safe-area-inset-bottom, 0px))}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.label{font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:8px}
.label::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px var(--sun-soft);flex:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
h1,h2{margin:0;text-wrap:balance;font-family:var(--font-display);font-weight:500}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:18px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{width:40px;height:40px;flex:none}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);padding:4px 10px;border-radius:999px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)} .sync.local i{background:var(--warn)}
button.sync{cursor:pointer}
.sync.local{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-soft)}
.greet{font-family:var(--font-display);font-size:15px;color:var(--muted);margin-top:2px}

/* date nav */
.datenav{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px}
.iconbtn{height:46px;width:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:22px;line-height:1;color:var(--accent);box-shadow:var(--shadow)}
.iconbtn:disabled{opacity:.35;cursor:default}
.datepick{position:relative;height:46px;border-radius:999px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.datepick b{font-family:var(--font-display);font-size:16px;font-weight:500}
.datepick span{font-size:12px;color:var(--muted);line-height:1.1}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:999px;background:var(--surface);border:2px dashed var(--sun);font-size:14px}
.status .cd{font-family:var(--font-num);font-size:14px;color:var(--ink);white-space:nowrap;background:var(--surface-2);border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.fert{background:var(--fertile);color:var(--fertile-ink)}
.pill.inf{background:var(--teal-soft);color:var(--ok)}
.pill.pre{background:var(--teal-soft);color:var(--ok)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* temperature */
.temp-card{background:linear-gradient(150deg,var(--accent-soft) 0%,var(--sun-soft) 100%);border-color:var(--accent-soft);position:relative;overflow:hidden}
.temp-card::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:var(--sun);opacity:.45;pointer-events:none}
.temp-card > *{position:relative;z-index:1}
.tempwrap{display:flex;align-items:stretch;gap:10px}
.tempfield{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;border:2px solid var(--line);border-radius:18px;padding:6px 14px;background:var(--surface)}
.tempfield:focus-within{border-color:var(--accent)}
.tempfield input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:42px;font-weight:500;padding:0;height:58px}
.tempfield input::placeholder{color:var(--grid-strong)}
.tempfield .unit{font-family:var(--font-display);font-size:18px;color:var(--muted)}
.primary{border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:0 20px;min-height:50px;font-size:16px;box-shadow:0 4px 0 #C94A76}
.primary.done{background:var(--teal-soft);color:var(--ok);box-shadow:0 4px 0 #B3E6DF}
.ghost{border:2px solid var(--line);border-radius:999px;background:var(--surface);padding:10px 14px;font-size:14px;font-weight:700}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--accent);font-size:13px;font-weight:700}
.hint{font-size:13px;color:var(--muted);min-height:18px}
.hint.err{color:var(--period)}

/* segmented & chips */
.seg{display:grid;gap:6px}
.seg.c4{grid-template-columns:repeat(4,1fr)} .seg.c3{grid-template-columns:repeat(3,1fr)}
.seg button,.chip{border:1.5px solid var(--line);background:var(--surface-2);border-radius:16px;min-height:46px;padding:6px 6px;font-size:13.5px;font-weight:600;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--sun);border-color:#F0C437;color:var(--ink);font-weight:800;box-shadow:0 3px 0 #F0C437}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:6px 14px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--ok);font-weight:800}
.bleed .chip[aria-pressed="true"]{background:var(--period);border-color:var(--period);color:#fff}
.code{font-family:var(--font-num);font-weight:500;font-size:15px;padding:2px 10px;border-radius:999px;background:var(--teal-soft);color:var(--mucus);min-width:40px;text-align:center}
.sublabel{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:-4px}

.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;font-weight:600}
.switch input{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--grid-strong);position:relative;transition:background .15s;flex:none;margin:0;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--period);margin:0}
textarea,.textin{width:100%;border:1.5px solid var(--line);border-radius:16px;background:var(--surface-2);padding:10px 14px;resize:vertical;min-height:44px}
textarea{min-height:80px}
.danger{color:var(--period);border-color:var(--period-soft)}
.danger.armed{background:var(--period);color:#fff;border-color:var(--period)}

/* chart */
.cyclenav{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px}
.cyclenav .mid{text-align:center}
.cyclenav .mid b{display:block;font-family:var(--font-display);font-weight:500;font-size:17px}
.cyclenav .mid span{font-size:12px;color:var(--muted)}
.facts{display:flex;flex-direction:column;gap:0;margin:0}
.fact{display:grid;grid-template-columns:100px 1fr;gap:10px;padding:9px 0;border-top:1px dashed var(--grid-strong);font-size:14px}
.fact:first-child{border-top:0;padding-top:0}
.fact dt{color:var(--muted);font-size:13px;font-weight:700}
.fact dd{margin:0;min-width:0}
.chartbox{display:flex;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.chartaxis{flex:none;border-right:1px solid var(--line);background:var(--surface)}
.chartscroll{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chartscroll svg{display:block}
svg text{font-family:var(--font-body);font-variant-numeric:tabular-nums}
.daycol{cursor:pointer}
.daycol:hover rect.hit{fill:var(--accent-soft);opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.example-tag{align-self:flex-start;font-size:12px;font-weight:800;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:4px 10px}

/* cycles */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--sun-soft);border:2px solid var(--sun);border-radius:18px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--font-num);font-size:24px;font-weight:500;line-height:1.2;color:var(--teal)}
.stat span{font-size:12px;color:var(--muted)}
.estimate{border:2px dashed var(--accent);background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.estimate .tag{align-self:flex-start;font-size:12px;font-weight:800;color:var(--fertile-ink);background:var(--fertile);border-radius:999px;padding:3px 10px}
.cyclelist{display:flex;flex-direction:column}
.cyc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 4px;border-top:1px dashed var(--grid-strong);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.cyc:first-child{border-top:0}
.cyc .t{font-weight:800}
.cyc .len{font-family:var(--font-num);font-size:20px;text-align:right;grid-row:span 2;align-self:center;color:var(--accent)}
.cyc .m{font-size:13px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:60px}
.bars div{flex:1;background:linear-gradient(var(--teal),var(--teal-soft));border-radius:10px 10px 4px 4px;min-width:6px;opacity:.85;max-width:44px}

/* data */
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exportbox{display:flex;flex-direction:column;gap:8px}
.exportbox textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:140px}
.rules p{margin:0}
.rules{font-size:14px;gap:8px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));padding-top:8px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));pointer-events:none}
.tabbar nav{pointer-events:auto;max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 0 var(--line), 0 12px 24px -14px rgba(201,74,118,.5)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:999px;font-size:11px;min-width:0;color:var(--muted);font-weight:700}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--fertile-ink);background:var(--accent-soft)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
.banner{font-size:13px;padding:10px 14px;border-radius:18px;background:var(--warn-soft);color:var(--warn)}
/* calendar */
.calhead{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px}
.calhead .mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.calhead .mid b{font-family:var(--font-display);font-weight:500;font-size:19px}
.todaybtn{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:800;padding:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.cal .wd{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding:2px 0 6px;letter-spacing:.04em}
.cd{position:relative;border:0;background:none;padding:0;height:46px;display:grid;place-items:center;min-width:0}
.cd .n{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink)}
.cd.future .n{color:var(--muted)}
.cd.f-obs::before,.cd.f-pred::before{content:"";position:absolute;left:0;right:0;top:6px;bottom:6px;background:var(--fertile)}
.cd.f-pred::before{background:repeating-linear-gradient(135deg,var(--fertile) 0 5px,transparent 5px 9px)}
.cd.fs::before{left:3px;border-top-left-radius:20px;border-bottom-left-radius:20px}
.cd.fe::before{right:3px;border-top-right-radius:20px;border-bottom-right-radius:20px}
.cd.p-log .n{background:var(--period);color:#fff;font-weight:500}
.cd.p-spot .n{background:var(--period-soft);color:var(--period)}
.cd.p-pred .n{border:2px dashed var(--period);color:var(--period)}
.cd.sel .n{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--teal)}
.cd.today .n{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.cd .ovm{position:absolute;z-index:2;top:0;right:calc(50% - 22px);width:15px;height:15px}
.cd .dotm{position:absolute;z-index:2;bottom:1px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--teal)}
.cd.blank{pointer-events:none}
.callegend{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;font-size:12.5px;color:var(--muted);padding-top:10px;border-top:1px dashed var(--grid-strong)}
.callegend span{display:flex;align-items:center;gap:7px;min-width:0}
.lg{width:18px;height:18px;border-radius:50%;flex:none;display:inline-block}
.lg.per{background:var(--period)} .lg.pp{border:2px dashed var(--period)}
.lg.fo{background:var(--fertile);border-radius:6px} .lg.fp{background:repeating-linear-gradient(135deg,var(--fertile) 0 4px,transparent 4px 7px);border-radius:6px;border:1px solid var(--fertile)}
.lg.dot{width:7px;height:7px;background:var(--teal);margin:0 5.5px}
.lg svg{width:18px;height:18px}
.daycard .dhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.daycard .dhead b{font-family:var(--font-display);font-weight:500;font-size:18px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag2{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700}
.tag2.per{background:var(--period-soft);color:var(--period)}
.tag2.fer{background:var(--fertile);color:var(--fertile-ink)}
.tag2.ov{background:var(--sun-soft);color:var(--sun-ink)}
.tag2.inf{background:var(--teal-soft);color:var(--ok)}
.tag2.est{background:transparent;border:1.5px dashed currentColor}
.coming{display:flex;flex-direction:column;gap:8px;font-size:14px}
.coming .ci{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.coming .ci i{width:14px;height:14px;border-radius:50%;margin-top:3px;display:inline-block}
.cloudform{display:flex;flex-direction:column;gap:8px}
.cloudmsg{font-size:13px;padding:8px 12px;border-radius:14px;background:var(--teal-soft);color:var(--ok)}
.cloudmsg.err{background:var(--period-soft);color:var(--period)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 66 Q53 80 48 94" stroke="var(--teal)" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="61" cy="83" rx="10" ry="5" fill="var(--teal)" transform="rotate(-32 61 83)"/><g fill="var(--accent)"><circle cx="50" cy="20" r="16"/><circle cx="71.9" cy="35.9" r="16"/><circle cx="63.5" cy="61.6" r="16"/><circle cx="36.5" cy="61.6" r="16"/><circle cx="28.1" cy="35.9" r="16"/></g><circle cx="50" cy="42" r="16.5" fill="var(--sun)"/><circle cx="44.2" cy="40.5" r="2.6" fill="var(--ink)"/><circle cx="55.8" cy="40.5" r="2.6" fill="var(--ink)"/><path d="M45.2 47 q4.8 4.4 9.6 0" stroke="var(--ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="39.5" cy="46" r="3" fill="#F7A3C0"/><circle cx="60.5" cy="46" r="3" fill="#F7A3C0"/></svg><div><h1>Cyclette</h1></div></div>
    <button type="button" class="sync" id="sync"><i></i><span>On this phone</span></button>
  </div>
  <div id="banner" class="banner" hidden></div>

  <!-- LOG -->
  <section class="view" id="v-log" style="margin-top:12px">
    <div class="greet" id="greet"></div>
    <div class="datenav">
      <button class="iconbtn" id="dPrev" aria-label="Previous day">‹</button>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const toUTC = s => { const [y,m,d]=s.split("-").map(Number); return Date.UTC(y,m-1,d); };
const fromUTC = t => new Date(t).toISOString().slice(0,10);
const addDays = (s,n) => fromUTC(toUTC(s)+n*864e5);
const diffDays = (a,b) => Math.round((toUTC(b)-toUTC(a))/864e5);
const todayStr = () => { const n=new Date(); return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate()); };
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = s => { const d=new Date(toUTC(s)); return d.getUTCDate()+" "+MO[d.getUTCMonth()]; };
const fmtW = s => { const d=new Date(toUTC(s)); return WD[d.getUTCDay()]+" "+d.getUTCDate()+" "+MO[d.getUTCMonth()]; };
const fmtY = s => { const d=new Date(toUTC(s)); return d.getUTCDate()+" "+MO[d.getUTCMonth()]+" "+d.getUTCFullYear(); };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t2 = n => (n/100).toFixed(2);
let toastTimer;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,2600); }

const SENS = [["dry","Dry"],["none","Nothing"],["moist","Moist"],["wet","Wet / slippery"]];
const APP = [["none","None"],["sticky","Sticky / creamy"],["clear","Clear / stretchy"]];
const BLEED = [["spotting","Spotting"],["light","Light"],["medium","Medium"],["heavy","Heavy"]];
const REASONS = ["Bad sleep","Alcohol","Sick","Measured late","Stress","Travel"];
const CODES = ["t","ø","f","S","S+"];
const FIELDS = ["temp","dist","distReason","sens","app","bleed","start","note"];

function norm(e){
  e = e||{};
  const o = { date:e.date };
  o.temp = (typeof e.temp==="number" && isFinite(e.temp)) ? Math.round(e.temp*100)/100 : null;
  o.dist = !!e.dist; o.distReason = typeof e.distReason==="string"?e.distReason:"";
  o.sens = SENS.some(x=>x[0]===e.sens)?e.sens:null;
  o.app = APP.some(x=>x[0]===e.app)?e.app:null;
  o.bleed = BLEED.some(x=>x[0]===e.bleed)?e.bleed:null;
  o.start = !!e.start; o.note = typeof e.note==="string"?e.note:"";
  return o;
}
const isEmpty = e => e.temp==null && !e.dist && !e.distReason && !e.sens && !e.app && !e.bleed && !e.start && !e.note;
function score(e){
  if(!e || (e.sens==null && e.app==null)) return null;
  let v=-1;
  if(e.sens==="dry") v=0; else if(e.sens==="none") v=1; else if(e.sens==="moist") v=2; else if(e.sens==="wet") v=4;
  if(e.app==="sticky") v=Math.max(v,3); else if(e.app==="clear") v=Math.max(v,4);
  if(v<0) v=1;
  return v;
}

/* ---------- storage: this phone + cloud sync (Supabase) ---------- */
let days = {};            // date -> entry
let settings = {usualLen:null, usualPeriod:null, lastBackup:null};
let storageOK = true;
const LS_KEY="cyclette.days.v1", LS_SET="cyclette.settings.v1", LS_META="cyclette.sync.v1", LS_CFG="cyclette.cloud.v1";
const ready = Promise.resolve(); const isReady = true;
let meta = {u:{}, dirty:{}, lastSync:null};   // u: key -> last change (ms); dirty: keys not yet in the cloud
function normSettings(o){
  o=o||{}; const n=Number(o.usualLen), p=Number(o.usualPeriod);
  return { usualLen:(n>=15&&n<=60)?Math.round(n):null, usualPeriod:(p>=1&&p<=12)?Math.round(p):null,
           lastBackup:(typeof o.lastBackup==="string"&&DATE_RE.test(o.lastBackup))?o.lastBackup:null };
}
function loadAll(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ const o=JSON.parse(raw); for(const k in o) if(DATE_RE.test(k)){ const n=norm({...o[k],date:k}); if(!isEmpty(n)) days[k]=n; } }
    const rs=localStorage.getItem(LS_SET); if(rs) settings=normSettings(JSON.parse(rs));
    const rm=localStorage.getItem(LS_META); if(rm){ const m=JSON.parse(rm); meta={u:m.u||{}, dirty:m.dirty||{}, lastSync:m.lastSync||null}; }
  }catch(e){ storageOK=false; }
  if(!storageOK){ const b=$("banner"); b.hidden=false; b.textContent="This browser is blocking storage, so entries can’t be saved. Open Cyclette from your home screen or turn off private browsing."; }
}
let persistAsked=false;
function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(days)); localStorage.setItem(LS_SET, JSON.stringify(settings)); localStorage.setItem(LS_META, JSON.stringify(meta)); }
  catch(e){ toast("Couldn’t save on this phone. Storage may be full or blocked."); throw e; }
  if(!persistAsked){ persistAsked=true; try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{}); }catch(e){} }
}
function touch(key){ meta.u[key]=Date.now(); meta.dirty[key]=1; }
function reportWriteError(){}
async function saveSettings(obj){
  const before=JSON.stringify([settings.usualLen,settings.usualPeriod]);
  settings=normSettings({...settings, ...obj});
  if(JSON.stringify([settings.usualLen,settings.usualPeriod])!==before) touch("settings");
  persist(); renderAll(); Cloud.schedule();
}
async function patch(date, fields){
  const merged = norm({...(days[date]||{date}), ...fields, date});
  if(isEmpty(merged)) delete days[date]; else days[date]=merged;
  touch(date); persist(); renderAll(); Cloud.schedule();
}
async function removeDay(date){ delete days[date]; touch(date); persist(); renderAll(); Cloud.schedule(); }
async function putMany(entries, replaceAll){
  const incoming = {}; entries.forEach(e=>{ if(e && DATE_RE.test(e.date)){ const n=norm(e); if(!isEmpty(n)) incoming[e.date]=n; } });
  const gone = replaceAll ? Object.keys(days).filter(d=>!incoming[d]) : [];
  gone.forEach(d=>{ delete days[d]; touch(d); });
  Object.keys(incoming).forEach(d=>{ days[d]=incoming[d]; touch(d); });
  persist(); renderAll(); Cloud.schedule();
  return gone.length + Object.keys(incoming).length;
}
function focusTemp(){ if(tab==="log" && logDate===TODAY && !(days[TODAY]&&days[TODAY].temp!=null)){ try{ $("tIn").focus({preventScroll:true}); }catch(_){} } }

/* cloud sync: last change wins, per day */
const Cloud = {
  client:null, user:null, state:"off", err:"", msg:"", timer:null, busy:false, again:false, recovery:false,
  cfg(){
    const b=window.CYCLETTE_CLOUD; if(b && b.url && b.key) return {url:b.url, key:b.key, baked:true};
    try{ const c=JSON.parse(localStorage.getItem(LS_CFG)||"null"); if(c && c.url && c.key) return c; }catch(e){}
    return null;
  },
  async init(){
    const c=this.cfg();
    if(!c || !window.supabase || !window.supabase.createClient){ this.state="off"; renderAll(); return; }
    try{
      this.client = window.supabase.createClient(c.url.trim(), c.key.trim(), {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:"cyclette-auth"}});
    }catch(e){ this.client=null; this.state="off"; this.err="The cloud address or key looks wrong."; renderAll(); return; }
    this.client.auth.onAuthStateChange((ev, session)=>{
      const was=this.user; this.user = session ? session.user : null;
      if(ev==="PASSWORD_RECOVERY"){ this.recovery=true; setTimeout(()=>showTab("data"),0); }
      if(!this.user){ this.state="out"; }
      else if(!was){ this.state="idle"; setTimeout(()=>this.sync(),0); }
      setTimeout(()=>renderAll(),0);
    });
    try{ const {data}=await this.client.auth.getSession(); this.user=data&&data.session?data.session.user:null; }catch(e){ this.user=null; }
    this.state = this.user ? "idle" : "out";
    renderAll();
    if(this.user) this.sync();
  },
  schedule(){ if(!this.client || !this.user) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.sync(), 1200); },
  async sync(){
    if(!this.client || !this.user) return;
    if(this.busy){ this.again=true; return; }
    if(navigator.onLine===false){ this.state="offline"; renderSyncPill(); return; }
    this.busy=true; this.state="syncing"; renderSyncPill();
    try{
      const changed = await this.pull();
      await this.push();
      meta.lastSync=new Date().toISOString(); this.state="idle"; this.err="";
      persist();
      if(changed) renderAll(); else renderSyncPill();
    }catch(e){
      this.state = navigator.onLine===false ? "offline" : "error";
      this.err = (e && (e.message||e.error_description)) || String(e);
      renderSyncPill(); if(tab==="data") renderAll();
    }finally{
      this.busy=false;
      if(this.again){ this.again=false; this.schedule(); }
    }
  },
  async pull(){
    const rows=[], PAGE=1000;
    for(let from=0;;from+=PAGE){
      const {data, error} = await this.client.from("entries").select("key,data,updated_at,deleted").order("key").range(from, from+PAGE-1);
      if(error) throw error;
      rows.push(...(data||[])); if(!data || data.length<PAGE) break;
    }
    let changed=false; const seen=new Set();
    for(const r of rows){
      const k=r.key; seen.add(k);
      const lu=meta.u[k]||0, ru=Number(r.updated_at)||0;
      if(ru>lu){ applyRemote(r); meta.u[k]=ru; delete meta.dirty[k]; changed=true; }
      else if(ru<lu && !meta.dirty[k]) meta.dirty[k]=1;
    }
    Object.keys(days).forEach(k=>{ if(!seen.has(k)){ meta.dirty[k]=1; if(!meta.u[k]) meta.u[k]=Date.now(); } });
    if(!seen.has("settings") && (settings.usualLen||settings.usualPeriod)){ meta.dirty.settings=1; if(!meta.u.settings) meta.u.settings=Date.now(); }
    return changed;
  },
  async push(){
    const keys=Object.keys(meta.dirty); if(!keys.length) return;
    const uid=this.user.id, snap={};
    const rows=keys.map(k=>{
      const u = snap[k] = meta.u[k] || Date.now();
      if(k==="settings") return {user_id:uid, key:k, data:{usualLen:settings.usualLen, usualPeriod:settings.usualPeriod}, updated_at:u, deleted:false};
      const e=days[k];
      if(!e) return {user_id:uid, key:k, data:{}, updated_at:u, deleted:true};
      const {date, ...rest}=e; return {user_id:uid, key:k, data:rest, updated_at:u, deleted:false};
    });
    for(let i=0;i<rows.length;i+=500){
      const chunk=rows.slice(i,i+500);
      const {error}=await this.client.from("entries").upsert(chunk, {onConflict:"user_id,key"});
      if(error) throw error;
      chunk.forEach(r=>{ if((meta.u[r.key]||0)===snap[r.key]) delete meta.dirty[r.key]; });
    }
  },
  async login(email,pw){ const {error}=await this.client.auth.signInWithPassword({email, password:pw}); if(error) throw error; },
  async signup(email,pw){
    const {data,error}=await this.client.auth.signUp({email, password:pw, options:{emailRedirectTo: location.origin+location.pathname}});
    if(error) throw error; return data && data.session ? "in" : "confirm";
  },
  async forgot(email){ const {error}=await this.client.auth.resetPasswordForEmail(email, {redirectTo: location.origin+location.pathname}); if(error) throw error; },
  async newPassword(pw){ const {error}=await this.client.auth.updateUser({password:pw}); if(error) throw error; this.recovery=false; },
  async logout(){ try{ await this.client.auth.signOut(); }catch(e){} this.user=null; this.state="out"; renderAll(); }
};
function applyRemote(r){
  if(r.key==="settings"){ const d=r.data||{}; settings=normSettings({usualLen:d.usualLen, usualPeriod:d.usualPeriod, lastBackup:settings.lastBackup}); return; }
  if(!DATE_RE.test(r.key)) return;
  if(r.deleted){ delete days[r.key]; return; }
  const n=norm({...(r.data||{}), date:r.key});
  if(isEmpty(n)) delete days[r.key]; else days[r.key]=n;
}
function renderSyncPill(){
  const el=$("sync"); let kind="on", text;
  if(Cloud.user){
    const pending=Object.keys(meta.dirty).length;
    if(Cloud.state==="syncing") { kind=""; text="Saving…"; }
    else if(Cloud.state==="offline") { kind="local"; text=pending?"Offline · will sync":"Offline"; }
    else if(Cloud.state==="error") { kind="local"; text="Sync problem"; }
    else text = pending ? "Saving…" : "Saved to cloud";
  } else if(Cloud.client){ kind="local"; text="Log in to sync"; }
  else {
    const n=Object.keys(days).length, lb=settings.lastBackup, age=lb?diffDays(lb,TODAY):null;
    if(!n){ kind=""; text="On this phone"; }
    else if(lb===null){ kind="local"; text="Back up your data"; }
    else if(age<=0){ text="Backed up today"; }
    else if(age<=14){ text=`Backed up ${age===1?"yesterday":age+" days ago"}`; }
    else { kind="local"; text=`Last backup ${age} days ago`; }
  }
  el.className="sync "+kind; el.querySelector("span").textContent=text;
}
function cloudCardHTML(){
  const n=Object.keys(days).length;
  const count=`<div class="small muted"><span class="num">${n}</span> day${n===1?"":"s"} logged</div>`;
  const msg = Cloud.err ? `<div class="cloudmsg err">${esc(Cloud.err)}</div>` : Cloud.msg ? `<div class="cloudmsg">${esc(Cloud.msg)}</div>` : "";
  if(Cloud.recovery && Cloud.user) return `<div class="card"><span class="label">Set a new password</span>${msg}
    <form class="cloudform" id="ccRecForm"><input class="textin" id="ccNewPw" type="password" autocomplete="new-password" placeholder="New password (at least 6 characters)"><button class="primary" type="submit" style="font-size:14px">Save new password</button></form></div>`;
  if(Cloud.user){
    const last = meta.lastSync ? new Date(meta.lastSync) : null;
    const lastTxt = last ? `${fmtW(todayStrOf(last))}, ${pad(last.getHours())}:${pad(last.getMinutes())}` : "not yet";
    const pending=Object.keys(meta.dirty).length;
    return `<div class="card"><span class="label">Cloud save</span>${msg}
      <div class="small">Logged in as <b>${esc(Cloud.user.email||"")}</b>. Every entry is saved on this phone and in your own cloud database, so it survives deleting the app or getting a new phone.</div>
      ${count}<div class="small muted">Last synced: ${lastTxt}${pending?` · ${pending} change${pending===1?"":"s"} waiting`:""}</div>
      <div class="btnrow"><button class="ghost" id="ccSync">Sync now</button><button class="ghost" id="ccOut">Log out</button></div></div>`;
  }
  if(Cloud.client){
    return `<div class="card"><span class="label">Cloud save</span>${msg}
      <div class="small">Log in to save your entries in your cloud database. You only need to do this once on each phone.</div>
      <form class="cloudform" id="ccForm" autocomplete="on">
        <input class="textin" id="ccEmail" type="email" autocomplete="username" inputmode="email" placeholder="Email">
        <input class="textin" id="ccPw" type="password" autocomplete="current-password" placeholder="Password (at least 6 characters)">
        <div class="btnrow"><button class="primary" type="submit" style="font-size:14px">Log in</button><button class="ghost" type="button" id="ccUp">Create account</button></div>
      </form>
      <button class="linkbtn" id="ccForgot" style="align-self:flex-start">Forgot password?</button>${count}</div>`;
  }
  return `<div class="card"><span class="label">Your data</span>${msg}
    <div class="small">Saved on this phone only. Removing Cyclette from your home screen or clearing browser data erases it, so back up regularly or connect cloud save.</div>
    ${count}
    <details><summary class="small" style="cursor:pointer;font-weight:700;color:var(--accent)">Connect cloud save</summary>
      <form class="cloudform" id="ccCfgForm" style="margin-top:8px">
        <input class="textin" id="ccUrl" placeholder="Project URL (https://…supabase.co)" autocapitalize="off" autocorrect="off" spellcheck="false">
        <input class="textin" id="ccKey" placeholder="Publishable key" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="primary" type="submit" style="font-size:14px;align-self:flex-start">Connect</button>
      </form></details></div>`;
}
function todayStrOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function bindCloud(){
  const busy=(btn,on)=>{ if(btn){ btn.disabled=on; } };
  const run = async (btn, fn) => { Cloud.err=""; Cloud.msg=""; busy(btn,true); try{ await fn(); }catch(e){ Cloud.err=friendlyAuthError(e); } busy(btn,false); renderAll(); };
  const f=$("ccForm");
  if(f){
    f.onsubmit=e=>{ e.preventDefault(); const em=$("ccEmail").value.trim(), pw=$("ccPw").value; if(!em||!pw){ Cloud.err="Enter your email and password."; renderAll(); return; } run(f.querySelector("button[type=submit]"), ()=>Cloud.login(em,pw)); };
    $("ccUp").onclick=()=>{ const em=$("ccEmail").value.trim(), pw=$("ccPw").value; if(!em||pw.length<6){ Cloud.err="Enter your email and a password with at least 6 characters."; renderAll(); return; }
      run($("ccUp"), async()=>{ const r=await Cloud.signup(em,pw); if(r==="confirm") Cloud.msg="Account created. Open the confirmation email, tap the link, then come back here and log in."; }); };
    $("ccForgot").onclick=()=>{ const em=$("ccEmail").value.trim(); if(!em){ Cloud.err="Type your email first, then tap Forgot password."; renderAll(); return; }
      run($("ccForgot"), async()=>{ await Cloud.forgot(em); Cloud.msg="Check your email for a reset link. It opens Cyclette in your browser, where you can set a new password."; }); };
  }
  const rf=$("ccRecForm"); if(rf) rf.onsubmit=e=>{ e.preventDefault(); const pw=$("ccNewPw").value; if(pw.length<6){ Cloud.err="Use at least 6 characters."; renderAll(); return; } run(rf.querySelector("button"), async()=>{ await Cloud.newPassword(pw); Cloud.msg="Password changed. Log in with it on your home screen app."; }); };
  if($("ccSync")) $("ccSync").onclick=()=>{ Cloud.err=""; Cloud.sync(); };
  if($("ccOut")) $("ccOut").onclick=()=>{ Cloud.err=""; Cloud.msg="Logged out. Your entries stay on this phone."; Cloud.logout(); };
  const cf=$("ccCfgForm");
  if(cf) cf.onsubmit=e=>{ e.preventDefault(); const url=$("ccUrl").value.trim(), key=$("ccKey").value.trim();
    if(!/^https:\/\/.+/.test(url) || key.length<20){ Cloud.err="Paste the Project URL (starts with https://) and the publishable key from Supabase."; renderAll(); return; }
    try{ localStorage.setItem(LS_CFG, JSON.stringify({url,key})); }catch(_){}
    Cloud.err=""; Cloud.init(); };
}
function friendlyAuthError(e){
  const m=((e&&(e.message||e.error_description))||String(e)).toLowerCase();
  if(m.includes("invalid login")) return "Email or password is wrong.";
  if(m.includes("email not confirmed")) return "Confirm your email first: open the email from Supabase and tap the link, then log in here.";
  if(m.includes("already registered")||m.includes("already exists")) return "There’s already an account with this email. Log in instead.";
  if(m.includes("rate limit")) return "Too many emails sent. Wait an hour and try again.";
  if(m.includes("failed to fetch")||m.includes("network")) return "No connection to the cloud. Check your internet and try again.";
  return (e&&e.message)||"Something went wrong.";
}

/* ---------- cycles & evaluation ---------- */
function buildCycles(map, today){
  const dates = Object.keys(map).sort();
  if(!dates.length) return [];
  const starts = dates.filter(d=>map[d].start);
  const endAll = dates[dates.length-1] > today ? dates[dates.length-1] : today;
  const cycles = [];
  if(!starts.length){ cycles.push({start:dates[0], end:endAll, unknownStart:true}); }
  else{
    if(dates[0] < starts[0]) cycles.push({start:dates[0], end:addDays(starts[0],-1), unknownStart:true});
    starts.forEach((s,i)=>cycles.push({start:s, end: i<starts.length-1 ? addDays(starts[i+1],-1) : endAll, unknownStart:false}));
  }
  cycles.forEach((c,i)=>{ c.len = diffDays(c.start,c.end)+1; c.complete = i<cycles.length-1 && !c.unknownStart; c.current = i===cycles.length-1; });
  return cycles;
}

/* 3-over-6 rule with Sensiplan exceptions. V = [{i, t}] valid readings, t in hundredths */
function evalTemp(V){
  for(let k=6;k<V.length;k++){
    const lows = V.slice(k-6,k);
    const CL = Math.max(...lows.map(v=>v.t));
    if(V[k].t<=CL) continue;
    const highs=[k]; let dip=null; let res=null;
    for(let j=k+1;;j++){
      if(j>=V.length){ res={state:"pending"}; break; }
      if(V[j].t>CL){
        highs.push(j);
        if(highs.length===3){
          const last=V[j].t;
          if(dip===null){
            if(last>=CL+20){ res={state:"confirmed", rule:"standard", at:j}; break; }
            const nx=V[j+1];
            if(!nx){ res={state:"pending", waiting4:true}; break; }
            if(nx.t>CL){ highs.push(j+1); res={state:"confirmed", rule:"exc1", at:j+1}; break; }
            res={state:"fail"}; break;
          } else {
            if(last>=CL+20){ res={state:"confirmed", rule:"exc2", at:j}; break; }
            res={state:"fail"}; break;
          }
        }
      } else {
        if(dip===null) dip=j; else { res={state:"fail"}; break; }
      }
    }
    if(res.state==="fail") continue;
    return { state:res.state, rule:res.rule||null, waiting4:!!res.waiting4, cl:CL,
      lows:lows.map(v=>v.i), highs:highs.map(h=>V[h].i), dip: dip!==null?V[dip].i:null,
      confirmIdx: res.state==="confirmed" ? V[res.at].i : null };
  }
  return {state:"none"};
}

function evalCycle(c, ruleLast, map){
  const n = c.len, ds=[];
  for(let i=0;i<n;i++){ const date=addDays(c.start,i); ds.push({i, date, e: map[date]||null}); }
  const V = ds.filter(d=>d.e && d.e.temp!=null && !d.e.dist).map(d=>({i:d.i, t:Math.round(d.e.temp*100)}));
  const temp = evalTemp(V);
  let best=null, peak=null, drop=false, firstMucus=null, infertileFrom=null;
  for(let i=0;i<n;i++){
    const s = score(ds[i].e);
    if(s!==null){
      if(s>=2 && firstMucus===null) firstMucus=i;
      if(s>=2 && (best===null || s>=best)){ best=s; peak=i; drop=false; }
      else if(peak!==null && s<best) drop=true;
    }
    if(temp.state==="confirmed" && i>=temp.confirmIdx && peak!==null && drop && i>=peak+3){ infertileFrom=i; break; }
  }
  let fertileStart = c.unknownStart ? 0 : ruleLast;
  if(firstMucus!==null && firstMucus<fertileStart) fertileStart=firstMucus;
  return { ds, V, temp, peak, peakScore:best, drop, firstMucus, infertileFrom, fertileStart, ruleLast };
}

function periodLength(c, map){
  if(c.unknownStart) return null;
  let lastReal=-1, gap=0;
  for(let i=0;i<Math.min(c.len,12);i++){
    const e=map[addDays(c.start,i)];
    if(e && e.bleed){ gap=0; if(e.bleed!=="spotting") lastReal=i; }
    else { gap++; if(gap>1) break; }
  }
  return lastReal>=0 ? lastReal+1 : null;
}
function ovIndex(c){
  const ev=c.ev; if(!ev || c.unknownStart) return null;
  if(ev.infertileFrom!==null && ev.peak!==null) return {i:ev.peak, kind:"confirmed"};
  if(ev.temp.state==="confirmed") return {i:Math.max(0, ev.temp.highs[0]-1), kind:"temp"};
  return null;
}
function analyse(map, today){
  const cycles = buildCycles(map, today);
  const fhmHistory = [];
  cycles.forEach(c=>{
    let ruleLast = 5;
    if(fhmHistory.length>=12) ruleLast = Math.max(0, Math.min(5, Math.min(...fhmHistory)-8));
    c.ev = evalCycle(c, ruleLast, map);
    if(c.complete && c.ev.temp.state==="confirmed") fhmHistory.push(c.ev.temp.highs[0]+1);
    c.perLen = periodLength(c, map);
  });
  return cycles;
}

function stats(cycles, today){
  const done = cycles.filter(c=>c.complete);
  const lens = done.map(c=>c.len);
  const out = { n: done.length, lens };
  const pers = cycles.filter(c=>c.perLen!=null && (c.complete || diffDays(c.start,today) > c.perLen)).map(c=>c.perLen);
  out.perN = pers.length; if(pers.length) out.perAvg = pers.reduce((a,b)=>a+b,0)/pers.length;
  if(!lens.length) return out;
  out.avg = lens.reduce((a,b)=>a+b,0)/lens.length;
  out.min = Math.min(...lens); out.max = Math.max(...lens);
  const conf = done.filter(c=>c.ev.infertileFrom!==null);
  if(conf.length){
    out.ovAvg = conf.reduce((a,c)=>a+c.ev.peak+1,0)/conf.length;
    const lut = conf.map(c=>c.len - c.ev.temp.highs[0]);
    out.lutAvg = lut.reduce((a,b)=>a+b,0)/lut.length;
  }
  const mucusDays = done.slice(-6).map(c=>c.ev.firstMucus).filter(x=>x!==null);
  const lutO = done.map(c=>{ const o=ovIndex(c); return o ? c.len-o.i-1 : null; }).filter(x=>x!==null && x>=7 && x<=20);
  out.lutN = lutO.length; if(lutO.length) out.lutO = lutO.reduce((a,b)=>a+b,0)/lutO.length;
  out.earliestMucus = mucusDays.length ? Math.min(...mucusDays) : null;
  return out;
}

function parseTemp(raw){
  let s = String(raw).trim().replace(",",".").replace(/\s|°|c/gi,"");
  if(!s) return null;
  if(/^\d{3,4}$/.test(s)) s = s.slice(0,2)+"."+s.slice(2);
  const v = Number(s);
  if(!isFinite(v)) return NaN;
  return Math.round(v*100)/100;
}

let lastLogDateRendered = null, tDirty = false;
function renderLog(){

  $("dNext").disabled = d>=TODAY;

  // disturbed

function setHint(msg, err){ const h=$("tHint"); h.textContent=msg; h.classList.toggle("err", !!err); if(err) h.dataset.sticky="1"; else delete h.dataset.sticky; }
function lastTempBefore(d){
  const ks = Object.keys(days).filter(k=>k<d && days[k].temp!=null).sort();
  return ks.length ? days[ks[ks.length-1]] : null;
}
function updateTempButton(){
  const e = days[logDate]; const v = parseTemp($("tIn").value); const b=$("tSave");
  if(e && e.temp!=null && v===e.temp){ b.textContent="Saved ✓"; b.classList.add("done"); }
  else { b.textContent = e && e.temp!=null ? "Update" : "Save"; b.classList.remove("done"); }
}
function cycleFor(d){ for(let i=CYC.length-1;i>=0;i--){ if(CYC[i].start<=d && d<=CYC[i].end) return i; } return -1; }
function statusHTML(d){
  if(!isReady) return `<span class="small muted">Loading your entries…</span>`;
  const ci = cycleFor(d);
  if(ci<0) return `<span class="pill neutral">No cycle yet</span><span class="small muted">Log your first period day to start counting.</span>`;
  const c = CYC[ci], ev=c.ev, idx=diffDays(c.start,d);
  const cd = c.unknownStart ? "" : `<span class="cd">Day ${idx+1}</span>`;
  if(ev.infertileFrom!==null && idx>ev.infertileFrom) return `${cd}<span class="pill inf">Infertile</span><span class="small muted">post-ovulatory, confirmed</span>`;
  if(ev.infertileFrom!==null && idx===ev.infertileFrom) return `${cd}<span class="pill inf">Infertile from this evening</span>`;
  if(c.unknownStart) return `<span class="pill neutral">Cycle start unknown</span><span class="small muted">Mark the first day of your period.</span>`;
  if(idx<ev.fertileStart) return `${cd}<span class="pill pre">Pre-fertile</span><span class="small muted">first ${ev.ruleLast}-day rule, no mucus</span>`;
  return `${cd}<span class="pill fert">Fertile</span><span class="small muted">${fertileReason(c,idx)}</span>`;
}
function fertileReason(c, idx){
  const ev=c.ev, t=ev.temp;
  if(t.state==="confirmed" && !(ev.peak!==null && ev.drop)) return "temp confirmed, waiting for mucus";
  if(t.state==="confirmed") return `temp confirmed, mucus count ${Math.min(3,Math.max(0,idx-ev.peak))}/3`;
  if(ev.peak!==null && ev.drop) return `mucus peak day ${ev.peak+1}, waiting for temp`;
  if(t.state==="pending") return `higher reading ${t.highs.length} of 3`;
  return "assume fertile";
}

  $("dPrev").onclick = ()=>{ setLogDate(addDays(logDate,-1)); };
  $("dNext").onclick = ()=>{ if(logDate<TODAY) setLogDate(addDays(logDate,1)); };

  };

  $("distT").onchange = e=>{ const on=e.target.checked; patch(logDate, on?{dist:true}:{dist:false, distReason:""}); };

    const o=$("distOther").value.trim(); const next=o?[...cur,o]:cur; const s=next.join("; ");
    if(s!==(days[logDate]?.distReason||"")) patch(logDate,{dist:true, distReason:s});
  }
  $("sensSeg").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; const cur=days[logDate]?.sens; patch(logDate,{sens: cur===b.dataset.v?null:b.dataset.v}); };
  $("appSeg").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; const cur=days[logDate]?.app; patch(logDate,{app: cur===b.dataset.v?null:b.dataset.v}); };
  $("bleedChips").onclick = e=>{
    const b=e.target.closest("button"); if(!b) return;
    const d=logDate, cur=days[d]; const v = cur?.bleed===b.dataset.v ? null : b.dataset.v;
    const f = {bleed:v};

      const prev = days[addDays(d,-1)];

      if(!prevBleeding && !recentStart){ f.start=true; toast("Marked as the start of a new cycle. Untick it if that’s wrong."); }
    }
    patch(d,f);

  $("delDay").onclick = e=>{

    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Tap again to delete everything for "+fmt(logDate); setTimeout(()=>{ b.classList.remove("armed"); b.textContent="Delete this day’s entry"; },4000); return; }

/* ---------- CHART ---------- */
const CW = 24, TOP = 26, H = 230, ROWH = 20, AXW = 52;
const ROWS = ["Day","Date","Bleed","Mucus","Peak"];

function chartSVG(c, ev, map, today){
  const n = c.len, W = n*CW;
  const temps = ev.ds.filter(d=>d.e&&d.e.temp!=null).map(d=>d.e.temp);
  let lo = temps.length ? Math.min(...temps) : 36.2, hi = temps.length ? Math.max(...temps) : 37.0;
  lo = Math.floor((lo-0.1)*10)/10; hi = Math.ceil((hi+0.1)*10)/10;
  while(hi-lo < 0.8){ lo=Math.round((lo-0.1)*10)/10; if(hi-lo<0.8) hi=Math.round((hi+0.1)*10)/10; }
  const span = hi-lo;
  const y = t => TOP + (hi - t)/span*H;
  const x = i => i*CW + CW/2;
  const rowY = r => TOP+H+8 + r*ROWH;
  const totalH = rowY(ROWS.length)+6;
  const labelStep = span>1.6 ? 0.2 : 0.1;
  let g = "", axis = "";
  // fertile band
  {
    const fs = ev.fertileStart, fe = ev.infertileFrom!==null ? ev.infertileFrom : n-1;
    if(fs<=fe){
      g += `<rect x="${fs*CW}" y="${TOP}" width="${(fe-fs+1)*CW}" height="${H}" fill="var(--fertile)"/>`;
      g += `<text x="${fs*CW+4}" y="${TOP+12}" font-size="10" fill="var(--fertile-ink)">fertile</text>`;
    }
  }
  // grid
  for(let k=0; k<=Math.round(span/0.05); k++){
    const t = Math.round((lo + k*0.05)*100)/100, yy=y(t);
    const strong = Math.abs((t*10)-Math.round(t*10))<1e-6;
    g += `<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="${strong?"var(--grid-strong)":"var(--grid)"}" stroke-width="1"/>`;
    const isLabel = Math.abs((t/labelStep)-Math.round(t/labelStep))<1e-6;
    if(isLabel) axis += `<text x="${AXW-6}" y="${yy+3.5}" font-size="10.5" text-anchor="end" fill="var(--muted)">${t.toFixed(1)}</text>`;
  }
  for(let i=0;i<=n;i++) g += `<line x1="${i*CW}" x2="${i*CW}" y1="${TOP}" y2="${TOP+H}" stroke="var(--grid)" stroke-width="1"/>`;
  // row separators
  for(let r=0;r<=ROWS.length;r++){ g += `<line x1="0" x2="${W}" y1="${rowY(r)}" y2="${rowY(r)}" stroke="var(--line)"/>`; }
  ROWS.forEach((l,r)=>{ axis += `<text x="${AXW-6}" y="${rowY(r)+14}" font-size="10.5" text-anchor="end" fill="var(--muted)" font-family="var(--font-body)">${l}</text>`; });
  axis += `<text x="6" y="14" font-size="10" fill="var(--muted)">°C</text>`;
  // today column
  const ti = diffDays(c.start, today);
  if(ti>=0 && ti<n) g += `<rect x="${ti*CW+0.5}" y="${TOP}" width="${CW-1}" height="${rowY(ROWS.length)-TOP}" fill="none" stroke="var(--accent)" stroke-width="1.2" rx="3"/>`;
  // coverline
  const T = ev.temp;
  if(T.state!=="none"){
    const yy = y(T.cl/100), x0 = T.lows[0]*CW;
    g += `<line x1="${x0}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--cover)" stroke-width="1.6" stroke-dasharray="5 3"/>`;
    g += `<text x="${x0+2}" y="${yy+12}" font-size="9.5" fill="var(--cover)">${t2(T.cl)}</text>`;
  }
  // estimated ovulation + infertile marker
  if(ev.infertileFrom!==null && ev.peak!==null){
    const px = x(ev.peak);
    g += `<line x1="${px}" x2="${px}" y1="${TOP}" y2="${TOP+H}" stroke="var(--fertile-ink)" stroke-width="1.2" stroke-dasharray="2 3"/>`;
    g += `<text x="${px}" y="${TOP-14}" font-size="9.5" text-anchor="middle" fill="var(--fertile-ink)">≈ov</text>`;
    const ix = (ev.infertileFrom+1)*CW;
    g += `<line x1="${ix}" x2="${ix}" y1="${TOP-4}" y2="${TOP+H}" stroke="var(--ok)" stroke-width="2"/>`;
  }
  // temperature line
  const pts = ev.ds.filter(d=>d.e&&d.e.temp!=null&&!d.e.dist);
  for(let k=1;k<pts.length;k++){
    const a=pts[k-1], b=pts[k], gap=b.i-a.i>1;
    g += `<line x1="${x(a.i)}" y1="${y(a.e.temp)}" x2="${x(b.i)}" y2="${y(b.e.temp)}" stroke="var(--line-temp)" stroke-width="2" stroke-linecap="round" ${gap?'stroke-dasharray="3 3" opacity=".6"':""}/>`;
  }
  const highSet = new Map(); if(T.state!=="none") T.highs.forEach((h,k)=>highSet.set(h,k+1));
  ev.ds.forEach(d=>{
    if(!d.e||d.e.temp==null) return;
    const cx=x(d.i), cy=y(d.e.temp);
    if(d.e.dist){
      g += `<circle cx="${cx}" cy="${cy}" r="4" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 1.5"/>`;
      g += `<text x="${cx}" y="${cy-8}" font-size="9" text-anchor="middle" fill="var(--muted)">( )</text>`;
    } else {
      g += `<circle cx="${cx}" cy="${cy}" r="4.3" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/>`;
      if(highSet.has(d.i)) g += `<text x="${cx}" y="${cy-8}" font-size="10" font-weight="600" text-anchor="middle" fill="var(--ink)">${highSet.get(d.i)}</text>`;
      if(T.dip===d.i) g += `<text x="${cx}" y="${cy+15}" font-size="9" text-anchor="middle" fill="var(--cover)">skip</text>`;
    }
  });
  // rows
  ev.ds.forEach(d=>{
    const cx=x(d.i), e=d.e;
    const dt = new Date(toUTC(d.date));
    g += `<text x="${cx}" y="${rowY(0)+14}" font-size="10" text-anchor="middle" fill="var(--ink)">${c.unknownStart?"·":d.i+1}</text>`;
    g += `<text x="${cx}" y="${rowY(1)+14}" font-size="9.5" text-anchor="middle" fill="var(--muted)">${dt.getUTCDate()}</text>`;
    if(e&&e.bleed){
      const r = {spotting:2,light:3.5,medium:5,heavy:6.5}[e.bleed];
      g += `<circle cx="${cx}" cy="${rowY(2)+10}" r="${r}" fill="var(--period)"${e.bleed==="spotting"?' opacity=".7"':""}/>`;
    }
    if(e&&e.start) g += `<path d="M${cx-4} ${rowY(2)+1.5} h8 l-4 4 z" fill="var(--period)"/>`;
    const s = score(e);
    if(s!==null){
      const col = s>=4?"var(--mucus)":s===3?"var(--mucus)":s===2?"var(--ink)":"var(--muted)";
      g += `<text x="${cx}" y="${rowY(3)+14}" font-size="${s>=3?11:10}" font-weight="${s>=3?700:400}" text-anchor="middle" fill="${col}">${CODES[s]}</text>`;
    }
  });
  if(ev.peak!==null){
    const px=x(ev.peak);
    g += `<text x="${px}" y="${rowY(4)+14}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--fertile-ink)">${ev.drop?"P":"P?"}</text>`;
    if(ev.drop) for(let k=1;k<=3;k++){ if(ev.peak+k<n) g += `<text x="${x(ev.peak+k)}" y="${rowY(4)+14}" font-size="10" text-anchor="middle" fill="var(--fertile-ink)">${k}</text>`; }
  }
  // hit targets
  let hits="";
  ev.ds.forEach(d=>{ hits += `<g class="daycol" data-date="${d.date}"><rect class="hit" x="${d.i*CW}" y="${TOP}" width="${CW}" height="${rowY(ROWS.length)-TOP}" fill="transparent"/></g>`; });
  const main = `<svg width="${W}" height="${totalH}" viewBox="0 0 ${W} ${totalH}" role="img" aria-label="Cycle chart">${g}${hits}</svg>`;
  const ax = `<svg width="${AXW}" height="${totalH}" viewBox="0 0 ${AXW} ${totalH}" aria-hidden="true">${axis}</svg>`;
  return {main, ax};
}

const RULE_LABEL = { standard:"3 over 6", exc1:"exception 1: slow rise, 4th reading used", exc2:"exception 2: one reading dipped and was skipped" };
function factsHTML(c, ev){
  const T=ev.temp, cd=i=>`day ${i+1}`, dt=i=>fmt(addDays(c.start,i));
  let temp;
  if(T.state==="confirmed") temp = `<b>Rise confirmed</b> on ${cd(T.confirmIdx)} (${dt(T.confirmIdx)}). Coverline <span class="num">${t2(T.cl)}</span> °C, ${RULE_LABEL[T.rule]}.`;
  else if(T.state==="pending") temp = T.waiting4 ? `3 higher readings, but the 3rd is less than 0.20 above the coverline <span class="num">${t2(T.cl)}</span>. One more reading above the line will confirm.` : `Higher reading ${T.highs.length} of 3 over the coverline <span class="num">${t2(T.cl)}</span> °C${T.dip!==null?", one dip skipped":""}.`;
  else temp = `No rise yet. ${ev.V.length} valid reading${ev.V.length===1?"":"s"}${ev.V.length<7?", the rule needs at least 6 low ones first":""}.`;
  let muc;
  if(ev.peak===null) muc = ev.ds.some(d=>score(d.e)!==null) ? "Only dry or nothing so far." : "No observations yet.";
  else if(!ev.drop) muc = `Best so far: <b>${CODES[ev.peakScore]}</b> on ${cd(ev.peak)}. The peak is the last day of best quality, so it shows once quality drops.`;
  else muc = `<b>Peak day</b> ${cd(ev.peak)} (${dt(ev.peak)}). 3rd day after peak: ${cd(ev.peak+3)}.`;
  let win;
  if(ev.infertileFrom!==null) win = `${c.unknownStart?"Until":"From "+cd(ev.fertileStart)+" until"} the evening of <b>${cd(ev.infertileFrom)}</b> (${dt(ev.infertileFrom)}). Infertile after that until the next period.`;
  else if(c.unknownStart) win = "Can’t be set without a known cycle start.";
  else win = `Open since ${cd(ev.fertileStart)}${ev.firstMucus!==null&&ev.firstMucus===ev.fertileStart&&ev.fertileStart<ev.ruleLast?" (mucus appeared)":` (first ${ev.ruleLast}-day rule)`}. Closes once temperature and mucus both confirm.`;
  let ov = ev.infertileFrom!==null ? `<b>Confirmed</b>. Most likely around ${cd(ev.peak)} (${dt(ev.peak)}), the mucus peak. The exact day can’t be pinned down.` : "Not confirmed yet.";
  return `<dl class="facts">
    <div class="fact"><dt>Temperature</dt><dd>${temp}</dd></div>
    <div class="fact"><dt>Mucus</dt><dd>${muc}</dd></div>
    <div class="fact"><dt>Fertile window</dt><dd>${win}</dd></div>
    <div class="fact"><dt>Ovulation</dt><dd>${ov}</dd></div></dl>`;
}

/* ---------- PREDICTIONS ---------- */
function predict(cycles, S){
  const P={len:null, lenSrc:null, per:5, perSrc:"default", L:14, LSrc:"default", future:[], cur:null, expected:null, late:null};
  if(S.n>=3){ P.len=S.avg; P.lenSrc="recorded"; P.lo=S.min; P.hi=S.max; }
  else if(settings.usualLen){ P.len=settings.usualLen; P.lenSrc="usual"; P.lo=P.len-2; P.hi=P.len+2; }
  else if(S.n>=1){ P.len=S.avg; P.lenSrc="few"; P.lo=S.min-2; P.hi=S.max+2; }
  if(S.perN>=1){ P.per=S.perAvg; P.perSrc="recorded"; } else if(settings.usualPeriod){ P.per=settings.usualPeriod; P.perSrc="usual"; }
  if(S.lutN>=1){ P.L=Math.max(9, Math.min(17, S.lutO)); P.LSrc="recorded"; }
  const cur=cycles[cycles.length-1];
  if(!P.len || !cur || cur.unknownStart) return P;
  const len=Math.round(P.len), L=Math.round(P.L), per=Math.max(1, Math.round(P.per));
  const ovOff=Math.max(6, len-L-1);
  P.ovOff=ovOff; P.perR=per;
  const o=ovIndex(cur);
  P.cur={ ovDate: o ? addDays(cur.start,o.i) : addDays(cur.start,ovOff), ovKind: o ? o.kind : "pred", closed: cur.ev.infertileFrom!==null };
  P.expected = addDays(cur.start, len);
  let s = P.expected;
  if(s<=TODAY){ P.late = diffDays(s, TODAY); s = addDays(TODAY,1); }
  for(let k=0;k<8 && diffDays(TODAY,s)<=240;k++){
    P.future.push({ start:s, perEnd:addDays(s,per-1), ov:addDays(s,ovOff), fFrom:addDays(s,ovOff-5), fTo:addDays(s,ovOff+1) });
    s = addDays(s,len);
  }
  return P;
}
function hasObs(c){ return c.ev.ds.some(d=>d.e && (d.e.temp!=null || score(d.e)!==null)); }

/* build a date -> info map covering past cycles and predictions */
function calMap(cycles, P){
  const M={};
  const get=d=>M[d]||(M[d]={});
  const range=(a,b,fn)=>{ for(let d=a; d<=b; d=addDays(d,1)) fn(d); };
  cycles.forEach((c,ci)=>{
    const ev=c.ev;
    for(let i=0;i<c.len;i++){
      const d=addDays(c.start,i), e=days[d], m=get(d);
      if(!c.unknownStart){ m.cd=i+1; }
      if(e){ m.entry = e.temp!=null || score(e)!==null || !!e.note; if(e.bleed) m.per = e.bleed==="spotting"?"spot":"log"; }
    }
    if(c.unknownStart) return;
    const obs=hasObs(c), o=ovIndex(c);
    if(obs){
      const endObs = ev.infertileFrom!==null ? ev.infertileFrom : (c.current ? Math.min(c.len-1, diffDays(c.start,TODAY)) : c.len-1);
      for(let i=ev.fertileStart;i<=endObs;i++) get(addDays(c.start,i)).fer="obs";
      if(ev.infertileFrom!==null) for(let i=ev.infertileFrom+1;i<c.len;i++) get(addDays(c.start,i)).inf=true;
    }
    if(o){ get(addDays(c.start,o.i)).ov=o.kind; }
    else if(c.complete && P.len){
      const oi=c.len-Math.round(P.L)-1;
      if(oi>=5){ get(addDays(c.start,oi)).ov="est"; if(!obs) for(let i=oi-5;i<=oi+1;i++) if(i>=0&&i<c.len) get(addDays(c.start,i)).fer="pred"; }
    }
    if(c.current && P.cur){
      const ovD=P.cur.ovDate;
      if(P.cur.ovKind==="pred"){
        get(ovD).ov = get(ovD).ov || "pred";
        if(!P.cur.closed){ const from = obs ? (addDays(ovD,-5)>TODAY?addDays(ovD,-5):addDays(TODAY,1)) : addDays(ovD,-5);
          range(from, addDays(ovD,1), d=>{ if(d>=c.start){ const m=get(d); if(!m.fer) m.fer="pred"; } }); }
      }
      for(let i=0;i<P.perR;i++){ const d=addDays(c.start,i); if(d>TODAY){ const m=get(d); if(!m.per) m.per="pred"; } }
      const firstNext = P.future.length ? P.future[0].start : null;
      if(firstNext) range(addDays(c.end,1), addDays(firstNext,-1), d=>{ get(d).cd=diffDays(c.start,d)+1; });
    }
  });
  P.future.forEach((f,k)=>{
    const nextStart = P.future[k+1] ? P.future[k+1].start : addDays(f.start, Math.round(P.len));
    range(f.start, addDays(nextStart,-1), d=>{ const m=get(d); m.cd=diffDays(f.start,d)+1; m.predCycle=true; });
    range(f.start, f.perEnd, d=>{ get(d).per="pred"; });
    range(f.fFrom, f.fTo, d=>{ const m=get(d); if(!m.fer) m.fer="pred"; });
    get(f.ov).ov="pred";
  });
  return M;
}

}

    ${dayCardHTML(calSel, M, P)}

  $("calPrev").onclick=()=>{ calMonth=shiftMonth(calMonth,-1); renderCal(); };

function shiftMonth(ym,k){ let [y,m]=ym.split("-").map(Number); m+=k; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return `${y}-${pad(m)}`; }
function dayCardHTML(d, M, P){
  const m=M[d]||{}, e=days[d], tags=[];

  if(m.fer==="pred") tags.push(`<span class="tag2 fer est">Likely fertile · estimate</span>`);
  if(m.ov==="confirmed") tags.push(`<span class="tag2 ov">Ovulation around here · temp + mucus</span>`);
  if(m.ov==="temp") tags.push(`<span class="tag2 ov">Ovulation around here · temperature rise</span>`);
  if(m.ov==="est"||m.ov==="pred") tags.push(`<span class="tag2 ov est">Ovulation likely · estimate</span>`);

    ${bits.length?`<div class="small">${bits.join(" · ")}</div>`:""}

function comingHTML(P, S){
  if(!P.len) return `<div class="estimate"><span class="tag">Predictions</span><div>Mark the first day of your last period and enter your usual cycle length on the Cycles tab. Then expected periods and fertile days show up here and in the calendar.</div></div>`;

  if(P.late!==null) items.push(["var(--period)", P.late===0?`Period due <b>today</b>.`:`Period expected ${fmtW(P.expected)}, <b>${P.late} day${P.late===1?"":"s"} late</b>.`]);

  items.push(["var(--sun)", `Most fertile days likely <b>${fmt(fw.a)} – ${fmt(fw.b)}</b>.`]);
  const src = P.lenSrc==="recorded" ? `your last ${S.n} cycles (avg ${S.avg.toFixed(1)} days)` : P.lenSrc==="usual" ? `the usual length you entered (${P.len} days)` : `only ${S.n} recorded cycle${S.n===1?"":"s"}`;
